# ==========================================================
# English AI 前端 Nginx 配置
# 功能：1) 托管 Vue 打包静态资源 2) /api 反代到网关 3) HTTPS
# ==========================================================

# 80 端口：全部 301 跳转到 HTTPS（保留 acme-challenge 给证书续期）
server {
    listen 80;
    server_name _;

    # Let's Encrypt 证书申请/续期验证目录（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ===== SSL 证书（挂载自宿主机 ./certs 目录，文件名固定） =====
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩，减小传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ===== /api 反向代理到 api-gateway =====
    # 去掉 /api 前缀（与开发环境 vite proxy rewrite 一致）
    location /api/ {
        proxy_pass http://api-gateway:8086/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 接口流式响应可能耗时较长，关闭缓冲并放宽超时
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }

    # ===== SPA history 路由 fallback：找不到文件回退到 index.html =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源长缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件体积限制（头像等）
    client_max_body_size 10m;
}
