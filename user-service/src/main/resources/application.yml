server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/user_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# MyBatis-Plus 配置
mybatis-plus:
  # 实体类存放位置
  type-aliases-package: com.english.ai.user.entity
  # XML映射文件（暂不使用，用注解）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 驼峰转下划线（sys_user → SysUser）
    map-underscore-to-camel-case: true
    # SQL日志（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略
      id-type: auto

# JWT 配置（开发环境）
jwt:
  secret: EnglishAI-CET4-CET6-JWT-Secret-Key-2025-Production
  expiration: 604800000  # 7天(毫秒)
