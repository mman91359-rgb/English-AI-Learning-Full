server:
  port: 8086

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # 全局CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # 路由规则
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
        - id: exercise-service
          uri: http://localhost:8082
          predicates:
            - Path=/exercise/**
        - id: learning-engine-service
          uri: http://localhost:8083
          predicates:
            - Path=/learning/**
# JWT配置（与user-service一致）
jwt:
  secret: EnglishAI-CET4-CET6-JWT-Secret-Key-2025-Production
  expiration: 604800000
